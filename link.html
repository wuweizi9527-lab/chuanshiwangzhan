/* 全局：铺满登录器公告小窗口(537x340)，无滚动条、无溢出 */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}
body {
    background-color: #000000;
    font-size: 12px;
    color: #00ff00;
    font-family: "宋体", Arial;
}
a:link, a:active, a:visited { color: #00ff00; text-decoration: none; }
a:hover { color: #ffcc00; text-decoration: underline; }

/* 字体颜色 */
.style28 { color: #ffffff; }
.style29 { color: #ffffff; }
.STYLE40 { color: #ffffff; }
.STYLE41 { color: #00ff00; }
.STYLE43 { font-weight: bold; color: #ffcc00; }
.STYLE46 { font-weight: bold; color: #FF0000; }
.STYLE51 { color: #FF0000; }

/* 外框：左侧立绘 + 右侧信息，列宽用百分比自适应 */
.wrap {
    width: 100%;
    height: 330px;
    border-collapse: collapse;
    table-layout: fixed;
    background-color: #000000;
}
.wrap > tbody > tr > td { padding: 0; }
.pic {
    width: 40%;
    text-align: center;
    vertical-align: middle;
}
.pic img {
    display: block;
    width: 100%;
    height: auto;
}
.info {
    vertical-align: top;
    padding: 0 2px 0 3px;
}

/* 右侧：内容区 + 底部跑马灯，垂直撑满 */
.inner {
    width: 100%;
    height: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}
.inner > tbody > tr > td { padding: 0; }
.t-mq { height: 26px; border-top: 1px solid #333333; }

/* 10 条公告：两列五排。
   用 auto 布局让列宽按实际文字宽度自适应，保证任何一行都不会被截断 */
.grid {
    width: 100%;
    height: 100%;
    border-collapse: collapse;
    table-layout: auto;
}
.grid > tbody > tr > td { padding: 0; }
.c1 { padding-right: 3px; }

.cell {
    font-size: 11px;
    letter-spacing: -1px;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
    vertical-align: middle;
    padding: 0;
}
/* 内容较长、容易顶到边缘的行：字号已统一变小，此处保留类目便于后续微调 */
.long-text {
    font-size: 11px;
    font-family: Tahoma, "宋体";
    letter-spacing: -1px;
}
.cell img.bullet { width: 6px; height: 6px; vertical-align: middle; margin-right: 2px; }
.cell img.tag   { width: 23px; height: 12px; vertical-align: middle; margin-left: 3px; }

/* 跑马灯 */
marquee {
    width: 96%;
    font-size: 12px;
    color: #ffffff;
}
</style>
