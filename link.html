<style>
/* 全局：适配登录器公告小窗口(537x340)，无滚动条、无溢出 */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}
body {
    background-color: #000000;
    font-size: 16px;
    color: #00ff00;
    font-family: "宋体", Arial;
}
a:link, a:active, a:visited { color: #00ff00; text-decoration: none; }
a:hover { color: #ffcc00; text-decoration: underline; }

/* 字体颜色 */
.style28 { color: #ffffff; }
.style29 { color: #ffffff; }
.STYLE40 { color: #ffffff; }
.STYLE41 { color: #00ff00; }
.STYLE43 { font-weight: bold; color: #ffcc00; }
.STYLE46 { font-weight: bold; color: #FF0000; }
.STYLE51 { color: #FF0000; }

/* 外框：左侧立绘 + 右侧公告清单 */
.wrap {
    width: 100%;
    height: 330px;
    border-collapse: collapse;
    table-layout: fixed;
    background-color: #000000;
}
.wrap > tbody > tr > td { padding: 0; }

/* 立绘：按 424x632 原始比例，占 41% 宽即可撑满 330px 高 */
.pic {
    width: 186px;
    text-align: center;
    vertical-align: top;
    padding: 0;
}
/* 立绘 941x1672：按 330px 高换算 = 186px 宽，严格等比、不裁切 */
.pic img {
    display: block;
    width: 186px;
    height: 330px;
}

/* 右侧：10 条公告单列排布，行高固定不依赖百分比高度传递 */
/* 提高优先级：否则被上面 ".wrap > tbody > tr > td{padding:0}" 覆盖成 0 */
.wrap > tbody > tr > td.info {
    vertical-align: top;
    padding: 0 4px 0 14px;   /* 与立绘之间留 14px 缝隙，不紧贴 */
}
.list {
    width: 100%;
    border-collapse: collapse;
    table-layout: auto;
}
.row {
    height: 30px;
    line-height: 30px;
    font-size: 16px;
    white-space: nowrap;
    vertical-align: middle;
    padding: 0;
}
.row img.bullet { width: 8px; height: 8px; vertical-align: middle; margin-right: 4px; }
.row img.tag   { width: 28px; height: 15px; vertical-align: middle; margin-left: 4px; }

/* 暂未开放提示浮层（对齐 index.html 的 soon-toast，绝对定位兼容老内核） */
.soon-toast {
    position: absolute;
    left: 50%;
    bottom: 36px;
    margin-left: -110px;
    width: 220px;
    display: none;
    z-index: 99;
    background-color: #2a0808;
    border: 1px solid #d4af37;
    color: #f2d98a;
    font-size: 13px;
    line-height: 18px;
    text-align: center;
    padding: 8px 10px;
}
.soon-toast.show { display: block; }

/* 跑马灯 */
.t-mq {
    height: 30px;
    line-height: 30px;
    border-top: 1px solid #333333;
    text-align: center;
}
marquee {
    width: 100%;
    font-size: 16px;
    line-height: 30px;
    color: #ffffff;
}
</style>
</head>
