html, body {

/* 外框：左侧立绘 + 右侧公告清单 */
.wrap {
    width: 100%;
    height: 330px;
    border-collapse: collapse;
    table-layout: fixed;
    background-color: #000000;
}
.wrap > tbody > tr > td { padding: 0; }

/* 立绘：按 424x632 原始比例，占 41% 宽即可撑满 330px 高 */
.pic {
    width: 186px;
    text-align: center;
    vertical-align: top;
    padding: 0;
}
/* 立绘 941x1672：按 330px 高换算 = 186px 宽，严格等比、不裁切 */
.pic img {
    display: block;
    position: relative;   /* z-index 兜底：老 IE 里公告文字溢出也盖不到立绘 */
    z-index: 2;
    width: 186px;
    height: 330px;
}

/* 右侧：10 条公告单列排布，行高固定不依赖百分比高度传递 */
/* 提高优先级：否则被上面 ".wrap > tbody > tr > td{padding:0}" 覆盖成 0 */
.wrap > tbody > tr > td.info {
    vertical-align: top;

.list {

    border-spacing: 0;

.soon-toast {

    bottom: 36px;
    margin-left: -110px;
    width: 220px;
    display: none;
    z-index: 99;

    line-height: 18px;

}
.soon-toast.show { display: block; }

/* 跑马灯：尺寸完全恢复原版 30px 高 / 16px 字，不因歌词而压缩 */
.t-mq {
    height: 30px;
    line-height: 30px;
    border-top: 1px solid #333333;
    text-align: center;
}
.t-mq td {
    height: 30px;
    line-height: 30px;
    padding: 0;
    font-size: 0;
}
/* 公告无缝滚动：文字一开始就贴着歌词格右侧，连续左滚、没有空白等待 */
.mq-box {
    display: block;
    position: relative;   /* 关键：老 IE 的 overflow:hidden 需父级定位才裁切子元素 */
    zoom: 1;              /* 触发 hasLayout，IE6/7 的裁切才生效 */
    width: 100%;
    height: 30px;
    line-height: 30px;
    overflow: hidden;
    white-space: nowrap;
    font-size: 16px;
    color: #ffffff;
}
.mq-track {
    display: block;
    margin-left: 0;       /* 用 margin 左移，留在普通流里，老 IE 裁切最可靠 */
    white-space: nowrap;
}
.mq-seg {
    display: inline-block;
    white-space: nowrap;
    padding-right: 48px;   /* 两份文案之间的间隔 */
}

/* 底部行内分栏：左侧一小格显示当前歌词，右侧公告跑马灯照常滚动（不挡立绘） */
.bottom-row {
    width: 100%;
    border-collapse: collapse;
    border-spacing: 0;
    table-layout: fixed;
}
.bottom-row td {
    height: 30px;
    line-height: 30px;
    padding: 0;

.bottom-row td.lrc-cell {
    width: 116px;
    background-color: #0a0800;
    border-right: 1px solid #333333;
    text-align: center;
    vertical-align: middle;
    overflow: hidden;
}
.bottom-row td.mq-cell { overflow: hidden; }   /* 老 IE 双保险 */
/* 歌词：12px 金字，最多两行，始终待在公告左侧这一小格内 */
.lrc-bar {
    display: block;
    position: relative;   /* 盖住溢出的公告文字，歌词始终可读 */
    z-index: 3;
    width: 116px;
    overflow: hidden;
    color: #ffcc00;
    font-size: 12px;
    line-height: 14px;
    text-align: center;

.lrc-bar span { display: block; line-height: 14px; }
.lrc-bar.one span { line-height: 30px; }  /* 单行撑满 30px 格、垂直居中 */
.lrc-bar.two  { padding-top: 1px; }    /* 两行 28px，上下各留 1px */
.lrc-bar.idle { color: #7a6a3a; }      /* 未播放时的暗金占位 */
/* 播放按钮浮在立绘左上角，不占文档流 */
.music-btn {

    z-index: 10;
}
.music-btn.on {
    color: #ffcc00;
    border-color: #d4af37;
    background-color: #3a2400;
}

<audio id="bgMusic" src="掌天武易.mp3" loop preload="auto"></audio>
<script type="text/javascript">
var bgAudio = document.getElementById("bgMusic");
var musicBtn = document.getElementById("musicBtn");
var lrcBar = document.getElementById("lrcBar");
var lrcTextNode = document.getElementById("lrcText");
var isPlaying = false;
var userPaused = false;   /* 用户按了暂停；纯手动播放，加载时不触发任何播放 */
var legacyAudio = !(bgAudio && typeof bgAudio.play === "function");
var legacyEl = document.getElementById("bgSoundLegacy");
var LEGACY_SRC = "掌天武易.mp3";
/* 老 IE 的 bgsound 没有 pause()：暂停 = 清空 src 并移除元素，恢复 = 插回同一个元素。
   初始元素没有 src，因此页面加载时不会出声（纯手动播放）。 */
function legacySetPlaying(on){
    if (!legacyEl) return;
    try {
        if (on){
            /* 强制重新插入：老 IE 只有新插入的 bgsound 才会可靠地重新加载播放 */
            if (legacyEl.parentNode) legacyEl.parentNode.removeChild(legacyEl);
            legacyEl.src = LEGACY_SRC;
            document.body.appendChild(legacyEl);
        } else {
            legacyEl.src = "";
            if (legacyEl.parentNode) legacyEl.parentNode.removeChild(legacyEl);
        }
    } catch (e) {}
}
/* 老内核续播：bgsound 元素没有任何播放进度接口(currentTime/seek)，
   暂停只能移除元素、恢复必然从头。改用系统自带的 Windows Media Player
   ActiveX 播放同一首 mp3：controls.pause() / play() 会保留 currentPosition，
   因此暂停后从原位置继续播放，歌词时间轴也自动对齐。
   若登录器禁用 ActiveX 或系统无 WMP，会自动退回 bgsound（行为同旧版）。
   ★ 默认关闭：WMP 是独立 COM 对象，登录器刷新页面时不会随页面销毁，
     旧播放器继续出声而新页面控制不到它，会出现「关不掉的残留声音」。
     改回 true 可恢复续播，但刷新后可能再现该问题。 */
var USE_WMP_RESUME = false;
var wmp = null;
function mediaAbsURL(){
    var href = location.href;
    return href.substring(0, href.lastIndexOf("/") + 1) + encodeURI(LEGACY_SRC);
}
/* 纯手动：加载时只创建 WMP 对象，不设 URL、不 play，所以不会出声。
   首次点 ♪ 时由 wmpStart() 注入地址并播放；之后 pause/play 仍可续播。 */
var wmpStarted = false;
function initWmp(){
    var p = null;
    if (!legacyAudio || !USE_WMP_RESUME || !window.ActiveXObject) return;
    try {
        p = new ActiveXObject("WMPlayer.OCX");
        if (!p || !p.controls || !p.settings) return;
        try { p.settings.volume = 100; } catch (e0) {}
        try { p.settings.setMode("loop", true); } catch (e1) {}
        try { p.settings.autoStart = false; } catch (e2) {}
        wmp = p;
    } catch (e) {
        try { if (p) { p.controls.stop(); p.URL = ""; p.close(); } } catch (e3) {}
        wmp = null;
    }
}
function wmpStart(){
    if (!wmp) return false;
    try {
        if (!wmp.URL) wmp.URL = mediaAbsURL();
        legacySetPlaying(false);   /* 关掉 bgsound，避免两个声音叠在一起 */
        wmp.controls.play();
        if (!wmpStarted){
            wmpStarted = true;
            setTimeout(wmpWatch, 8000);
        }
        return true;
    } catch (e) { return false; }
}
/* 手动播放后 8 秒仍没出声 = WMP 被拦截或打不开媒体，退回 bgsound */
function wmpWatch(){
    if (!wmp || !wmpStarted || userPaused || !isPlaying) return;
    try {
        if (wmp.playState === 3 || wmp.controls.currentPosition > 0) return;
    } catch (e) {}
    fallbackToBgsound();
}
/* WMP 若被宿主拦截或打不开媒体，自动退回 bgsound，保证一定有声音 */
function fallbackToBgsound(){
    if (!wmp) return;
    try { wmp.controls.stop(); } catch (e0) {}
    try { wmp.URL = ""; } catch (e1) {}
    try { wmp.close(); } catch (e2) {}   /* 释放 COM 对象，避免残留播放器 */
    wmp = null;
    legacySetPlaying(true);
    isPlaying = true;
    userPaused = false;
    musicStart = (new Date()).getTime();
    lastLrcIdx = -1;
    updateMusicUI();
}
/* 登录器 30 秒后自动刷新：刷新前必须显式停掉并释放所有播放器。
   老 IE 的 bgsound / WMP COM 对象未必随页面销毁，残留下来就会变成
   「歌还在放、按钮却是未播放、再点会叠出第二路且关不掉」的幽灵声音。 */
function stopAllMusic(){
    isPlaying = false;
    try { if (!legacyAudio && bgAudio) bgAudio.pause(); } catch (e) {}
    try { legacySetPlaying(false); } catch (e1) {}   /* 清空 src 并移除 bgsound */
    if (wmp){
        try { wmp.controls.stop(); } catch (e2) {}
        try { wmp.URL = ""; } catch (e3) {}
        try { wmp.close(); } catch (e4) {}           /* 释放 COM 播放器对象 */
        wmp = null;
    }
    return;   /* 不返回字符串，避免 IE 弹出「确定要离开此页吗」确认框 */

var lastLrcIdx = -1;
function setLrcText(txt){
    /* 长句从中点折成均衡两行，避免末尾只剩一两个字；短句单行居中 */
    var n = txt.length;
    if (n > 9){   /* 116px 宽 / 12px 字约每行 9 字，超过就均衡折两行 */
        var mid = Math.ceil(n / 2);
        lrcTextNode.innerText = txt.substring(0, mid);
        lrcTextNode.appendChild(document.createElement("br"));
        lrcTextNode.appendChild(document.createTextNode(txt.substring(mid)));
    } else {

    }

    var h = lrcTextNode.offsetHeight || 14;

}
function syncLyrics(){
    var t;

        /* WMP 的真实播放位置：暂停时不推进，恢复后天然续上 */
        try {
            t = wmp.controls.currentPosition - LRC_OFFSET;
            if (t > LOOP_SEC) t = t % LOOP_SEC;

               缓冲/停止(1)不动，避免播放中途被误判成从头播 */
            var st = wmp.playState;

                wmp.controls.play();
                t = -LRC_OFFSET;

            t = ((new Date()).getTime() - musicStart) / 1000 - LRC_OFFSET;
            if (t > LOOP_SEC) t = t % LOOP_SEC;
        }
    } else if (!legacyAudio && typeof bgAudio.currentTime === "number"){
        t = bgAudio.currentTime - LRC_OFFSET;
    } else {
        t = ((new Date()).getTime() - musicStart) / 1000 - LRC_OFFSET;
        if (t > LOOP_SEC) t = t % LOOP_SEC;
    }
    if (!isPlaying) t = -1;   /* 暂停 / 未播放：歌词格显示占位，公告照常滚动 */
    if (t < 0){
        if (lastLrcIdx === -2) return;
        lastLrcIdx = -2;
        hideLrc();
        return;
    }
    var idx = 0;
    for (var i = 0; i < lyricsData.length; i++){
        if (lyricsData[i].time <= t) idx = i; else break;
    }
    if (idx === lastLrcIdx) return;
    lastLrcIdx = idx;
    setLrcText(lyricsData[idx].text);   /* 唱哪句显示哪句，静态不滚动 */

function updateMusicUI(){

function startMusic(){
    if (userPaused || isPlaying || legacyAudio) return;
    try {
        var p = bgAudio.play();

function toggleMusic(){

    if (window.event) { try { window.event.cancelBubble = true; } catch (e) {} }

            try {
                if (isPlaying){ wmp.controls.pause(); isPlaying = false; userPaused = true; }
                else {

                    if (!wmpStart()) throw new Error("wmp start failed");
                    isPlaying = true; userPaused = false;
                }
            } catch (e) {
                try { wmp.controls.stop(); } catch (e2) {}
                try { wmp.URL = ""; } catch (e3) {}
                try { wmp.close(); } catch (e4) {}
                wmp = null;   /* WMP 失效，退回 bgsound（该路径只能从头播） */
                legacySetPlaying(true);
                isPlaying = true;
                userPaused = false;
                musicStart = (new Date()).getTime();
            }
            lastLrcIdx = -1;
            updateMusicUI();
            syncLyrics();
            return;
        }
        if (isPlaying){
            legacySetPlaying(false);   /* 移除 bgsound = 停止播放 */
            isPlaying = false;
            userPaused = true;
        } else {
            legacySetPlaying(true);    /* 插回 bgsound，从头播放 */
            isPlaying = true;
            userPaused = false;
            musicStart = (new Date()).getTime();
        }
        lastLrcIdx = -1;
        updateMusicUI();
        syncLyrics();
        return;
    }
    if (isPlaying){
        try { bgAudio.pause(); } catch (e) {}
        isPlaying = false;
        userPaused = true;
        lastLrcIdx = -1;
        updateMusicUI();
        hideLrc();
    } else {
        userPaused = false;
        lastLrcIdx = -1;
        startMusic();
    }
